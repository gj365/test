<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/app.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約確認／キャンセル</title>
  
</head>

<body data-page="cancellation">

  <div class="container">

    <h2>予約確認 / キャンセル（View / Cancel）</h2>
    <p class="page-subtitle" data-page-subtitle>予約時に入力した氏名（アルファベット）で検索してください。</p>

    <div class="search-box">
<!--      <input type="email" id="email" placeholder="予約時のメールアドレス / Enter your reservation email">
-->
      <input type="text" id="name" autocomplete="name">
      <button id="search" class="btn primary">検索 / Search</button>
    </div>

    <div class="table-scroll">
    <table id="result-table" style="display:none;">
      <thead>
        <tr>
          <th>日付</th>
          <th>時間</th>
          <th>名前 (alphabet)</th>
          <th>名前 (katakana)</th>
          <th>国籍・地域</th>
          <th>身分</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </div>

    <div id="empty" class="empty"></div>

    <div class="actions">
      <a href="index.html" class="btn cancel">← Topに戻る / BACK</a>
    </div>

  </div>

  <div id="footer-container"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/cancellation.js"></script>
</body>

</html>
