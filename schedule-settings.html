<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/app.css">
  <title>予約枠設定</title>
</head>
<body data-page="schedule-settings">
  <div class="container">
    <h2>予約枠設定</h2>
    <p class="settings-deadline"><label for="deadline" id="deadline-label">予約締切（日本時間）</label>
      <input type="datetime-local" id="deadline" required value="2026-10-17T23:00">
    </p>
    <table id="schedule-settings">
      <thead>
        <tr>
          <th scope="col" id="settings-time">時間</th>
          <th scope="col"><input type="date" value="2026-09-24" aria-label="日程 1"></th>
          <th scope="col"><input type="date" value="2026-09-25" aria-label="日程 2"></th>
          <th scope="col"><input type="date" value="2026-09-28" aria-label="日程 3"></th>
          <th scope="col"><input type="date" value="2026-09-30" aria-label="日程 4"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button type="button" id="save-settings" class="btn primary" disabled>保存</button>
      <a href="result.html" class="btn cancel">予約管理へ戻る</a>
    </div>
    <p id="settings-message" role="status" aria-live="polite"></p>
  </div>
  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/schedule-config.js"></script>
  <script src="assets/js/schedule-settings.js"></script>
</body>
</html>
